[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]
gas_reports = ["LendingPool", "Controller", "OracleRouter", "Liquidator", "ShortRouter"]
# fork tests are opt-in: forge test --match-path "test/fork/*" --fork-url $BSC_RPC_URL
no_match_path = "test/fork/*"

[profile.default.fuzz]
runs = 256
max_test_rejects = 200000

[profile.default.invariant]
runs = 64
depth = 48
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 512
depth = 128

[profile.fork]
no_match_path = ""
match_path = "test/fork/*"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_fork = "http://127.0.0.1:8549"
